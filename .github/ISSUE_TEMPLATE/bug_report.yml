name: Bug report
description: Report a reproducible defect with baseline and regression context
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and regression risk
