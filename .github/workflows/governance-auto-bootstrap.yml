name: Governance Auto Bootstrap

on:
  push:
    branches:
      - main
  create:
  workflow_dispatch:
  repository_dispatch:
    types:
      - governance-bootstrap
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: governance-auto-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository != 'chainsolutions-wealthtech/Governed-Repository-Template' && github.event.repository.is_template != true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch || github.ref_name || 'main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect pending template initialization
        id: pending
        shell: bash
        run: |
          if [ -f .template-source ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "base_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto initialize governance
        if: steps.pending.outputs.needed == 'true'
        env:
          GOVERNANCE_TEMPLATE_REVISION: "2.3.0"
        run: python3 scripts/auto_bootstrap.py

      - name: Validate initialized state
        if: steps.pending.outputs.needed == 'true'
        run: python3 scripts/validate_governance.py

      - name: Create initialization commit
        if: steps.pending.outputs.needed == 'true'
        id: init_commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "governance: auto-initialize repository"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Finalize bootstrap receipt
        if: steps.pending.outputs.needed == 'true'
        run: |
          python3 scripts/finalize_bootstrap.py \
            --initialization-commit-sha "${{ steps.init_commit.outputs.sha }}"
          python3 scripts/validate_governance.py --bootstrap-attestation

      - name: Create attestation commit
        if: steps.pending.outputs.needed == 'true'
        id: attestation_commit
        shell: bash
        run: |
          git add .governance STATUS.md LOOP_STATE.md WORK_LOG.md SUIVI.md
          git commit -m "governance: attest automatic bootstrap"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push with exact-HEAD guard and retry
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        env:
          BASE_HEAD: ${{ steps.pending.outputs.base_head }}
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH"
          test -n "$BASE_HEAD"

          pushed=false
          for attempt in 1 2 3; do
            if git fetch origin "$TARGET_BRANCH"; then
              remote_head="$(git rev-parse FETCH_HEAD)"
              if [ "$remote_head" != "$BASE_HEAD" ]; then
                echo "HEAD_MOVED: expected=$BASE_HEAD remote=$remote_head"
                exit 3
              fi

              if git push origin "HEAD:$TARGET_BRANCH"; then
                pushed=true
                break
              fi
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done

          if [ "$pushed" != "true" ]; then
            echo "BOOTSTRAP_PUSH_FAILED_AFTER_RETRIES"
            exit 2
          fi

      - name: Verify remote bootstrap attestation
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          local_head="$(git rev-parse HEAD)"
          test "$local_head" = "${{ steps.attestation_commit.outputs.sha }}"
          test "$(git rev-parse "$local_head^")" = "${{ steps.init_commit.outputs.sha }}"
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse FETCH_HEAD)"
          test "$remote_head" = "$local_head"
          test ! -e .template-source
          test -z "$(git status --porcelain)"
          python3 scripts/validate_governance.py --bootstrap-attestation
          echo "BOOTSTRAP_REMOTE_ATTESTATION_PASS=$remote_head"

      - name: Already initialized
        if: steps.pending.outputs.needed != 'true'
        run: |
          test ! -e .template-source
          python3 scripts/validate_governance.py
          echo "Governance already initialized; no mutation required."
