name: Governed Control Plane

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [governed_request_start]

permissions:
  contents: read
  issues: write

concurrency:
  group: governed-control-plane-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.repository == 'chainsolutions-wealthtech/Governed-Repository-Template' &&
      (
        github.event_name == 'repository_dispatch' ||
        (
          startsWith(github.event.issue.title, '[Governed Request]') &&
          (
            github.event_name == 'issues' ||
            (github.event_name == 'issue_comment' && github.actor != 'github-actions[bot]')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile control plane
        run: python3 -m py_compile scripts/governed_request.py scripts/control_plane_issue_bridge.py scripts/control_plane_create_repository.py scripts/control_plane_upgrade_local_entry.py scripts/control_plane_local_command.py scripts/control_plane_local_start.py scripts/control_plane_provision_mcp_credential.py scripts/project_continuity.py scripts/verify_cug_app.py scripts/control_plane_cug_bootstrap_handoff.py

      - name: Verify CUG before accepting a machine creation request
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.creation != null
        env:
          GOVERNED_CUG_BOT_LOGIN: ${{ vars.GOVERNED_CUG_BOT_LOGIN }}
          GOVERNED_CUG_APP_CLIENT_ID: ${{ vars.GOVERNED_CUG_APP_CLIENT_ID }}
          GOVERNED_CUG_APP_PRIVATE_KEY: ${{ secrets.GOVERNED_CUG_APP_PRIVATE_KEY }}
        run: python3 scripts/verify_cug_app.py

      - name: Process governed request
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNED_CUG_BOT_LOGIN: ${{ vars.GOVERNED_CUG_BOT_LOGIN }}
        run: python3 scripts/control_plane_issue_bridge.py

      - name: Verify CUG GitHub App identity for governed creation
        if: steps.process.outputs.use_cug == 'true' && !(github.event_name == 'repository_dispatch' && github.event.client_payload.creation != null)
        env:
          GOVERNED_CUG_BOT_LOGIN: ${{ vars.GOVERNED_CUG_BOT_LOGIN }}
          GOVERNED_CUG_APP_CLIENT_ID: ${{ vars.GOVERNED_CUG_APP_CLIENT_ID }}
          GOVERNED_CUG_APP_PRIVATE_KEY: ${{ secrets.GOVERNED_CUG_APP_PRIVATE_KEY }}
        run: python3 scripts/verify_cug_app.py

      - name: Mint target-owner GitHub App installation token
        if: steps.process.outputs.executor_required == 'true'
        id: creator-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ (steps.process.outputs.use_cug == 'true' && vars.GOVERNED_CUG_APP_CLIENT_ID) || vars.GOVERNED_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ (steps.process.outputs.use_cug == 'true' && secrets.GOVERNED_CUG_APP_PRIVATE_KEY) || secrets.GOVERNED_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.process.outputs.target_owner_canonical }}
          permission-administration: write
          permission-contents: read

      - name: Execute generate-from-template creation
        if: steps.process.outputs.executor_required == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNED_CREATOR_TOKEN: ${{ steps.creator-token.outputs.token }}
        run: python3 scripts/control_plane_create_repository.py --issue-number "${{ steps.process.outputs.issue_number }}"

      - name: Mint scoped CUG bootstrap observation token
        if: steps.process.outputs.cug_bootstrap_required == 'true'
        id: cug-bootstrap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GOVERNED_CUG_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNED_CUG_APP_PRIVATE_KEY }}
          owner: ${{ steps.process.outputs.target_owner_canonical }}
          repositories: ${{ steps.process.outputs.repository_name }}
          permission-actions: read
          permission-contents: read

      - name: Observe bootstrap attestation and prepare local handoff
        if: steps.process.outputs.cug_bootstrap_required == 'true'
        id: cug-handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNED_BOOTSTRAP_READ_TOKEN: ${{ steps.cug-bootstrap-token.outputs.token }}
        run: python3 scripts/control_plane_cug_bootstrap_handoff.py --issue-number "${{ steps.process.outputs.issue_number }}"

      - name: Mint target-owner token for local-entry upgrade
        if: steps.process.outputs.upgrade_required == 'true'
        id: upgrade-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ (steps.process.outputs.use_cug == 'true' && vars.GOVERNED_CUG_APP_CLIENT_ID) || vars.GOVERNED_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ (steps.process.outputs.use_cug == 'true' && secrets.GOVERNED_CUG_APP_PRIVATE_KEY) || secrets.GOVERNED_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.process.outputs.upgrade_target_owner }}
          repositories: ${{ steps.process.outputs.use_cug == 'true' && steps.process.outputs.upgrade_target_repository_name || '' }}
          permission-contents: write
          permission-workflows: write
          permission-issues: write

      - name: Apply current local-entry upgrade to target
        if: steps.process.outputs.upgrade_required == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERNED_TARGET_TOKEN: ${{ steps.upgrade-token.outputs.token }}
        run: |
          python3 scripts/control_plane_upgrade_local_entry.py             --target-repository "${{ steps.process.outputs.upgrade_target_repository }}"             --expected-head "${{ steps.process.outputs.upgrade_expected_head }}"             --issue-number "${{ steps.process.outputs.issue_number }}"


      - name: Mint target-owner token for machine local start
        if: steps.cug-handoff.outputs.local_start_required == 'true' || steps.process.outputs.local_start_required == 'true'
        id: local-start-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ (steps.process.outputs.use_cug == 'true' && vars.GOVERNED_CUG_APP_CLIENT_ID) || vars.GOVERNED_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ (steps.process.outputs.use_cug == 'true' && secrets.GOVERNED_CUG_APP_PRIVATE_KEY) || secrets.GOVERNED_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.cug-handoff.outputs.local_start_target_owner || steps.process.outputs.local_start_target_owner }}
          repositories: ${{ steps.process.outputs.use_cug == 'true' && (steps.cug-handoff.outputs.local_start_target_repository_name || steps.process.outputs.local_start_target_repository_name) || '' }}
          permission-contents: write
          permission-issues: write

      - name: Dispatch governed machine local start
        if: steps.cug-handoff.outputs.local_start_required == 'true' || steps.process.outputs.local_start_required == 'true'
        env:
          GOVERNED_TARGET_TOKEN: ${{ steps.local-start-token.outputs.token }}
        run: |
          python3 scripts/control_plane_local_start.py \
            --target-repository "${{ steps.cug-handoff.outputs.local_start_target_repository || steps.process.outputs.local_start_target_repository }}" \
            --expected-head "${{ steps.cug-handoff.outputs.local_start_expected_head || steps.process.outputs.local_start_expected_head }}" \
            --objective-b64 "${{ steps.cug-handoff.outputs.local_start_objective_b64 || steps.process.outputs.local_start_objective_b64 }}" \
            --source-issue "${{ steps.process.outputs.issue_number }}" \
            --continuity-b64 "${{ steps.cug-handoff.outputs.local_start_continuity_b64 || steps.process.outputs.local_start_continuity_b64 }}"

      - name: Mint target-owner token for machine local command
        if: steps.process.outputs.local_command_required == 'true'
        id: local-command-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ (steps.process.outputs.use_cug == 'true' && vars.GOVERNED_CUG_APP_CLIENT_ID) || vars.GOVERNED_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ (steps.process.outputs.use_cug == 'true' && secrets.GOVERNED_CUG_APP_PRIVATE_KEY) || secrets.GOVERNED_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.process.outputs.local_command_target_owner }}
          repositories: ${{ steps.process.outputs.use_cug == 'true' && steps.process.outputs.local_command_target_repository_name || '' }}
          permission-contents: write
          permission-issues: read
          permission-secrets: write

      - name: Provision governed MCP credential when required
        id: mcp-credential
        continue-on-error: true
        if: steps.process.outputs.local_command_required == 'true'
        env:
          GOVERNED_TARGET_TOKEN: ${{ steps.local-command-token.outputs.token }}
          GOVERNED_MCP_AUTH_TOKEN: ${{ secrets.GOVERNED_MCP_AUTH_TOKEN }}
        run: |
          python3 scripts/control_plane_provision_mcp_credential.py \
            --target-repository "${{ steps.process.outputs.local_command_target_repository }}" \
            --target-issue "${{ steps.process.outputs.local_command_target_issue }}" \
            --expected-head "${{ steps.process.outputs.local_command_expected_head }}"

      - name: Report governed MCP credential provisioning failure
        if: steps.process.outputs.local_command_required == 'true' && steps.mcp-credential.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code="${{ steps.mcp-credential.outputs.failure_code }}"
          if [ -z "$code" ]; then code="MCP_CREDENTIAL_PROVISIONING_FAILED"; fi
          body=$(cat <<EOF
          ### Governed MCP credential provisioning blocked

          Target: \`${{ steps.process.outputs.local_command_target_repository }}\`
          Target issue: \`#${{ steps.process.outputs.local_command_target_issue }}\`
          Expected HEAD: \`${{ steps.process.outputs.local_command_expected_head }}\`
          Failure code: \`$code\`

          No target governed state advanced and the machine command was not dispatched.
          EOF
          )
          gh api "repos/${{ github.repository }}/issues/${{ steps.process.outputs.issue_number }}/comments" -f body="$body"

      - name: Dispatch governed machine local command
        if: steps.process.outputs.local_command_required == 'true' && steps.mcp-credential.outcome == 'success'
        env:
          GOVERNED_TARGET_TOKEN: ${{ steps.local-command-token.outputs.token }}
        run: |
          python3 scripts/control_plane_local_command.py             --target-repository "${{ steps.process.outputs.local_command_target_repository }}"             --target-issue "${{ steps.process.outputs.local_command_target_issue }}"             --expected-head "${{ steps.process.outputs.local_command_expected_head }}"             --command-b64 "${{ steps.process.outputs.local_command_b64 }}"             --source-issue "${{ steps.process.outputs.issue_number }}"
