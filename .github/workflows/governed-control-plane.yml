name: Governed Control Plane

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: governed-control-plane-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.repository == 'chainsolutions-wealthtech/Governed-Repository-Template' &&
      (
        github.event_name == 'repository_dispatch' ||
        (
          startsWith(github.event.issue.title, '[Governed Request]') &&
          (
            github.event_name == 'issues' ||
            (github.event_name == 'issue_comment' && github.actor != 'github-actions[bot]')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile control plane
        run: python3 -m py_compile scripts/governed_request.py scripts/control_plane_issue_bridge.py

      - name: Process governed request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/control_plane_issue_bridge.py
