name: GSCC Observable Arrival Gateway

on:
  push:
  create:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issues:
    types:
      - opened
      - reopened
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: gscc-observable-arrival-${{ github.repository }}-${{ github.actor }}-${{ github.ref_name || github.event_name }}
  cancel-in-progress: false

jobs:
  arrival:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exhaustive first-touch evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/first_touch_exhaustive_collector.py github-event \
            --output "${RUNNER_TEMP}/first-touch-capture.json"

      - name: Materialize first-touch capture database
        run: |
          python3 .governance/control-plane-db/materialize.py \
            --output "${RUNNER_TEMP}/first-touch-capture.sqlite" \
            --first-touch-capture "${RUNNER_TEMP}/first-touch-capture.json"

      - name: Upload exhaustive first-touch evidence
        uses: actions/upload-artifact@v4
        with:
          name: first-touch-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/first-touch-capture.json
            ${{ runner.temp }}/first-touch-capture.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Enter canonical GSCC arrival gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gscc_observable_arrival.py github-event
