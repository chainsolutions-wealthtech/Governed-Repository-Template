name: GSCC Entry Context Gate

on:
  repository_dispatch:
    types:
      - gscc_entry_context
  workflow_dispatch:
    inputs:
      post_json:
        description: Safe host/provider entry POST JSON
        required: true
        type: string
      requested_ref:
        description: Repository ref requested for governed entry
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  entry-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      entry_open: ${{ steps.complete.outputs.entry_open }}
      entry_receipt: ${{ steps.complete.outputs.entry_receipt }}
      context_digest: ${{ steps.complete.outputs.context_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.requested_ref || inputs.requested_ref || github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Complete GSCC entry schema from POST plus verified GET facts
        id: complete
        shell: bash
        env:
          DISPATCH_POST_JSON: ${{ toJSON(github.event.client_payload.entry_post) }}
          INPUT_POST_JSON: ${{ inputs.post_json }}
          REQUESTED_REF: ${{ github.event.client_payload.requested_ref || inputs.requested_ref || github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          post_json="$INPUT_POST_JSON"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            post_json="$DISPATCH_POST_JSON"
          fi
          actual_head="$(git rev-parse HEAD)"
          python3 scripts/gscc_entry_context_gate.py \
            --post-json "$post_json" \
            --repository "${{ github.repository }}" \
            --default-branch "$DEFAULT_BRANCH" \
            --requested-ref "$REQUESTED_REF" \
            --observed-head "$actual_head" \
            --output "$RUNNER_TEMP/gscc-entry-context.json"

      - name: Persist entry context evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gscc-entry-context-${{ github.run_id }}
          path: ${{ runner.temp }}/gscc-entry-context.json
          if-no-files-found: error
          retention-days: 30

      - name: Open repository entry only when context is complete
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.complete.outputs.entry_open }}" = "true" || {
            echo "::error::GSCC_ENTRY_CONTEXT_CLOSED missing=${{ steps.complete.outputs.missing_required }}"
            exit 3
          }
          echo "GSCC_ENTRY_CONTEXT_OPEN receipt=${{ steps.complete.outputs.entry_receipt }}"
