name: Governance CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate governed repository structure
        run: python3 scripts/validate_governance.py

      - name: Compile governance scripts
        run: python3 -m py_compile scripts/initialize_governance.py scripts/auto_bootstrap.py scripts/finalize_bootstrap.py scripts/governance_agent.py scripts/validate_governance.py scripts/adopt_existing_repository.py scripts/governed_request.py scripts/control_plane_issue_bridge.py scripts/control_plane_local_command.py scripts/control_plane_provision_mcp_credential.py scripts/control_plane_upgrade_local_entry.py scripts/test_upgrade_session_head_migration.py scripts/control_plane_create_repository.py scripts/test_bootstrap_consistency.py scripts/test_connection_intent.py scripts/test_entry_action_router.py scripts/test_repository_adoption.py scripts/test_repository_scope.py scripts/test_control_plane_request.py scripts/test_control_plane_issue_contract.py scripts/test_repository_creation_executor.py scripts/local_governed_entry.py scripts/local_entry_issue_bridge.py scripts/local_entry_apply_baseline.py scripts/test_local_governed_entry.py scripts/test_mcp_credential_provisioning.py scripts/test_mcp_both_ssh_fallback.py scripts/mcp_repository_discovery.py scripts/test_governance_model_integrity.py

      - name: Test bootstrap state consistency
        run: python3 scripts/test_bootstrap_consistency.py

      - name: Test connection intent routing
        run: python3 scripts/test_connection_intent.py

      - name: Test mandatory entry action routing
        run: python3 scripts/test_entry_action_router.py

      - name: Test additive existing repository adoption
        run: python3 scripts/test_repository_adoption.py

      - name: Test organization/personal repository scopes
        run: python3 scripts/test_repository_scope.py

      - name: Test central governed request lifecycle
        run: python3 scripts/test_control_plane_request.py

      - name: Test GitHub issue control plane boundary
        run: python3 scripts/test_control_plane_issue_contract.py

      - name: Test generate-from-template repository executor
        run: python3 scripts/test_repository_creation_executor.py

      - name: Test repository-local governed agent entry
        run: python3 scripts/test_local_governed_entry.py

      - name: Test automatic MCP credential provisioning
        run: python3 scripts/test_mcp_credential_provisioning.py

      - name: Test BOTH degraded SSH fallback
        run: python3 scripts/test_mcp_both_ssh_fallback.py

      - name: Test governed upgrade session HEAD continuity
        run: python3 scripts/test_upgrade_session_head_migration.py

      - name: Test Governance Model projection integrity
        run: python3 scripts/test_governance_model_integrity.py

      - name: Test source-only adaptive choice question catalogue
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/adaptive_question_planner.py scripts/test_adaptive_question_catalogue.py
            python3 scripts/test_adaptive_question_catalogue.py
          else
            echo "ADAPTIVE_CHOICE_QUESTION_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Test source-only control-plane knowledge base
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/test_control_plane_knowledge_base.py
            python3 scripts/test_control_plane_knowledge_base.py
          else
            echo "CONTROL_PLANE_KNOWLEDGE_BASE_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Test source-only server knowledge model
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/test_server_knowledge_model.py
            python3 scripts/test_server_knowledge_model.py
          else
            echo "SERVER_KNOWLEDGE_MODEL_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Test source-only identity and secret lifecycle
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/test_identity_secret_lifecycle.py
            python3 scripts/test_identity_secret_lifecycle.py
          else
            echo "IDENTITY_SECRET_LIFECYCLE_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Test source-only governed execution engine
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/governed_execution_engine.py scripts/governed_execution_workflow_bridge.py scripts/test_governed_execution_engine.py scripts/test_governed_execution_workflow.py
            python3 scripts/test_governed_execution_engine.py
            python3 scripts/test_governed_execution_workflow.py
          else
            echo "GOVERNED_EXECUTION_ENGINE_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Test source-only execution package compiler
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/governed_execution_package_compiler.py scripts/test_governed_execution_package_compiler.py
            python3 scripts/test_governed_execution_package_compiler.py
          else
            echo "GOVERNED_EXECUTION_PACKAGE_COMPILER_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Test source-only MCP capability snapshot model
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/control_plane_mcp_capability_snapshot.py scripts/test_control_plane_mcp_capability_snapshot.py
            python3 scripts/test_control_plane_mcp_capability_snapshot.py
          else
            echo "MCP_CAPABILITY_SNAPSHOT_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Test bounded read-only knowledge collectors
        run: |
          if [ -f .template-source ]; then
            python3 -m py_compile scripts/control_plane_server_inventory_collector.py scripts/test_control_plane_server_inventory_collector.py scripts/control_plane_github_secret_metadata.py scripts/test_control_plane_github_secret_metadata.py
            python3 scripts/test_control_plane_server_inventory_collector.py
            python3 scripts/test_control_plane_github_secret_metadata.py
          else
            echo "KNOWLEDGE_COLLECTORS_SOURCE_ONLY_SKIP: client repository"
          fi

      - name: Materialize canonical control-plane database
        run: |
          if [ -f .governance/control-plane-db/materialize.py ]; then
            python3 .governance/control-plane-db/materialize.py
          else
            echo "CONTROL_PLANE_DB_SOURCE_ONLY_SKIP: client repository has no source-only control-plane database"
          fi

      - name: Check textual integrity
        run: git diff --check
