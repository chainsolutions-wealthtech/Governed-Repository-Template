scc/session_endpoint.py scripts/gscc/instrumentation.py scripts/gscc/gacr_compat.py scripts/gscc/admission.py scripts/gscc/admission_harvester.py scripts/gscc_observable_arrival.py scripts/test_gscc_observable_arrival.py scripts/first_touch_exhaustive_collector.py scripts/test_first_touch_capture_basic.py scripts/first_touch_field_block_gate.py scripts/test_first_touch_field_block_gate.py scripts/first_touch_expected_field_registry.py scripts/test_first_touch_expected_field_registry.py scripts/first_touch_connection_completeness.py scripts/test_first_touch_connection_completeness.py scripts/first_touch_entry_contract.py scripts/test_first_touch_entry_contract.py scripts/first_touch_agent_transport_extractor.py scripts/test_first_touch_agent_transport_extractor.py scripts/gscc_entry_router.py scripts/test_gscc_entry_router.py scripts/gscc_persisted_entry_pipeline.py scripts/test_gscc_persisted_entry_pipeline.py scripts/gscc_post_q1_gate_router.py scripts/test_gscc_post_q1_gate_router.py scripts/test_first_touch_state_artifact_persistence.py scripts/gscc_arrival_identity.py scripts/gscc_session_runtime.py scripts/test_gscc_per_arrival_identity_session_runtime.py scripts/test_gscc_pre_entry_contract.py scripts/test_agent_entry_autodiscovery.py scripts/first_touch_state_artifact.py scripts/gscc/first_touch_store.py scripts/gscc/first_touch_handoff.py scripts/gscc/gse_projection.py scripts/test_gscc_gse_gacr_realignment_matrix.py scripts/test_gscc_admission.py tests/test_gscc_core.py scripts/gse/__init__.py scripts/gse/session_state_engine.py tests/gse/test_session_state_engine.py scripts/gscc_gacr/__init__.py scripts/gscc_gacr/contract.py scripts/gscc_gacr/control_adapter.py scripts/gscc_gacr/fake_session_endpoint.py scripts/gscc_gacr/real_session_endpoint_adapter.py scripts/gscc_gacr/gse_projection.py scripts/test_gscc_gacr_bidirectional_control.py scripts/test_gscc_gacr_contract_authority.py scripts/test_gscc_gacr_gse_projection.py scripts/test_gscc_gse_gacr_e2e.py scripts/test_master_documentation_integrity.py scripts/test_case1_closure_integrity.py

      - name: Test GSCC core protocol and SessionEndpoint
