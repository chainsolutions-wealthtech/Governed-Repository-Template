name: Governance CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate governed repository structure
        run: python3 scripts/validate_governance.py

      - name: Compile governance scripts
        run: python3 -m py_compile scripts/initialize_governance.py scripts/auto_bootstrap.py scripts/finalize_bootstrap.py scripts/governance_agent.py scripts/validate_governance.py scripts/adopt_existing_repository.py scripts/governed_request.py scripts/control_plane_issue_bridge.py scripts/control_plane_local_command.py scripts/control_plane_provision_mcp_credential.py scripts/control_plane_upgrade_local_entry.py scripts/test_upgrade_session_head_migration.py scripts/control_plane_create_repository.py scripts/test_bootstrap_consistency.py scripts/test_connection_intent.py scripts/test_entry_action_router.py scripts/test_repository_adoption.py scripts/test_repository_scope.py scripts/test_control_plane_request.py scripts/test_control_plane_issue_contract.py scripts/test_repository_creation_executor.py scripts/local_governed_entry.py scripts/local_entry_issue_bridge.py scripts/local_entry_apply_baseline.py scripts/test_local_governed_entry.py scripts/test_mcp_credential_provisioning.py scripts/test_mcp_both_ssh_fallback.py scripts/mcp_repository_discovery.py

      - name: Test bootstrap state consistency
        run: python3 scripts/test_bootstrap_consistency.py

      - name: Test connection intent routing
        run: python3 scripts/test_connection_intent.py

      - name: Test mandatory entry action routing
        run: python3 scripts/test_entry_action_router.py

      - name: Test additive existing repository adoption
        run: python3 scripts/test_repository_adoption.py

      - name: Test organization/personal repository scopes
        run: python3 scripts/test_repository_scope.py

      - name: Test central governed request lifecycle
        run: python3 scripts/test_control_plane_request.py

      - name: Test GitHub issue control plane boundary
        run: python3 scripts/test_control_plane_issue_contract.py

      - name: Test generate-from-template repository executor
        run: python3 scripts/test_repository_creation_executor.py

      - name: Test repository-local governed agent entry
        run: python3 scripts/test_local_governed_entry.py

      - name: Test automatic MCP credential provisioning
        run: python3 scripts/test_mcp_credential_provisioning.py

      - name: Test BOTH degraded SSH fallback
        run: python3 scripts/test_mcp_both_ssh_fallback.py

      - name: Test governed upgrade session HEAD continuity
        run: python3 scripts/test_upgrade_session_head_migration.py

      - name: Check textual integrity
        run: git diff --check
