name: Server Identity Secret Facts Refresh

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - server_identity_secret_refresh
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.repository == 'chainsolutions-wealthtech/Governed-Repository-Template' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number == 12 &&
          github.event.comment.body == '/refresh-server-identity-secret-facts' &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mint source-repository GitHub App token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GOVERNED_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNED_GITHUB_APP_PRIVATE_KEY }}
          owner: chainsolutions-wealthtech
          repositories: Governed-Repository-Template
          permission-contents: write
          permission-pull-requests: write

      - name: Capture expected facts revision
        id: state
        shell: bash
        run: |
          set -euo pipefail
          revision="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.governance/control-plane-state/server-identity-secret-facts.json')
          print(json.loads(p.read_text(encoding='utf-8'))['revision'])
          PY
          )"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Collect bounded read-only S1/S2 identity-secret metadata
        env:
          GOVERNED_MCP_AUTH_TOKEN: ${{ secrets.GOVERNED_MCP_AUTH_TOKEN }}
          GOVERNED_MCP_URL: https://mcp.wealthtechinnovations.com/mcp
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          observation="$(mktemp)"
          trap 'rm -f "$observation"' EXIT
          python3 scripts/control_plane_server_identity_secret_metadata.py --server ALL --live > "$observation"
          python3 scripts/control_plane_server_identity_secret_facts.py             --input "$observation"             --expected-revision "${{ steps.state.outputs.revision }}"
          rm -f "$observation"
          trap - EXIT

      - name: Validate persisted safe facts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_control_plane_server_identity_secret_metadata.py
          python3 scripts/test_control_plane_server_identity_secret_facts.py
          python3 scripts/validate_governance.py
          python3 .governance/control-plane-db/materialize.py
          git diff --check

      - name: Detect safe fact change
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- .governance/control-plane-state/server-identity-secret-facts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist safe facts through governed PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="governance/server-identity-secret-facts-${GITHUB_RUN_ID}"
          git config user.name "chainsolutions-governance[bot]"
          git config user.email "governance@users.noreply.github.com"
          git checkout -b "$branch"
          git add .governance/control-plane-state/server-identity-secret-facts.json
          git commit -m "governance: refresh safe S1 S2 identity-secret facts"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$branch"             --title "governance: refresh safe S1 S2 identity-secret facts"             --body "Automated governed read-only KBI-04O refresh. Only validated status/shape/digest metadata is persisted. No secret values, raw MCP payloads, server coordinates, or mutation authority are included. Merge remains subject to Governance CI."
