name: GSCC Provider First Touch Ingress

on:
  repository_dispatch:
    types:
      - gscc_provider_first_touch
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  pull_request:
    paths:
      - "scripts/provider_first_touch_ingress.py"
      - "scripts/provider_first_touch_repository_enrichment.py"
      - "scripts/provider_first_tool_hook.py"
      - "scripts/gscc/instrumentation.py"
      - "scripts/governed_github_read_connector.py"
      - "scripts/chatgpt_github_surface_instrumentation.py"
      - "scripts/provider_first_touch_evidence.py"
      - "scripts/first_touch_entry_contract.py"
      - "scripts/first_touch_state_artifact.py"
      - "scripts/first_touch_agent_transport_extractor.py"
      - "scripts/gscc_arrival_identity.py"
      - "scripts/gscc_session_runtime.py"
      - "scripts/test_gscc_per_arrival_identity_session_runtime.py"
      - "scripts/gscc_persisted_entry_pipeline.py"
      - ".governance/control-plane-db/008_gscc_observable_entry_pipeline.sql"
      - ".governance/control-plane-db/009_gscc_post_q1_gate_route.sql"
      - ".governance/control-plane-db/010_gscc_arrival_session_identity.sql"
      - ".governance/control-plane-db/011_gscc_session_runtime.sql"
      - "scripts/first_touch_connection_completeness.py"
      - "scripts/first_touch_field_block_gate.py"
      - "scripts/gscc/first_touch_handoff.py"
      - "scripts/test_provider_first_touch_ingress.py"
      - "scripts/test_provider_first_touch_repository_enrichment.py"
      - "scripts/test_provider_first_tool_hook.py"
      - "tests/test_gscc_core.py"
      - "scripts/test_governed_github_read_connector.py"
      - "scripts/test_chatgpt_github_surface_instrumentation.py"
      - ".github/workflows/gscc-provider-first-touch-ingress.yml"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: gscc-first-touch-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  regression:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python3 -m py_compile scripts/provider_first_touch_ingress.py scripts/provider_first_touch_repository_enrichment.py scripts/provider_first_touch_evidence.py scripts/provider_first_tool_hook.py scripts/gscc/instrumentation.py scripts/governed_github_read_connector.py scripts/chatgpt_github_surface_instrumentation.py scripts/first_touch_entry_contract.py scripts/first_touch_state_artifact.py scripts/gscc/first_touch_handoff.py scripts/test_provider_first_touch_ingress.py scripts/test_provider_first_tool_hook.py scripts/test_provider_first_touch_repository_enrichment.py scripts/test_governed_github_read_connector.py
      - name: Test provider first-touch sidecar, repository enrichment and host hook
        run: PYTHONPATH=scripts:. python3 -m unittest scripts/test_provider_first_touch_ingress.py scripts/test_provider_first_touch_repository_enrichment.py scripts/test_provider_first_tool_hook.py scripts/test_governed_github_read_connector.py scripts/test_chatgpt_github_surface_instrumentation.py tests/test_gscc_core.py

  ingest:
    if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[GSCC First Touch]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate provider envelope
        env:
          PROVIDER_ENVELOPE: ${{ toJson(github.event.client_payload) }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            printf '%s' "$PROVIDER_ENVELOPE" > "$RUNNER_TEMP/provider-first-touch-envelope.json"
          else
            printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/gscc-first-touch-issue-body.txt"
            python3 -c 'import json,os,pathlib; raw=pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("gscc-first-touch-issue-body.txt").read_text(encoding="utf-8").strip(); prefix="/gscc-first-touch"; assert raw.startswith(prefix), "body must start with /gscc-first-touch"; payload=json.loads(raw[len(prefix):].strip()); assert isinstance(payload,dict), "JSON object required"; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("provider-first-touch-envelope.json").write_text(json.dumps(payload,ensure_ascii=False,sort_keys=True),encoding="utf-8")'
          fi

      - name: Mint per-arrival GSCC connection identity
        id: arrival
        run: |
          python3 scripts/gscc_arrival_identity.py             --envelope "$RUNNER_TEMP/provider-first-touch-envelope.json"             --event "$GITHUB_EVENT_PATH"             --run-id "$GITHUB_RUN_ID"             --run-attempt "$GITHUB_RUN_ATTEMPT"             --output "$RUNNER_TEMP/provider-first-touch-identified-envelope.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"provider-first-touch-identified-envelope.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("state_scope="+v["gscc_arrival"]["state_scope"]+"\n")
              f.write("arrival_ref="+v["gscc_arrival"]["arrival_ref"]+"\n")
          PY
          mv "$RUNNER_TEMP/provider-first-touch-identified-envelope.json" "$RUNNER_TEMP/provider-first-touch-envelope.json"

      - name: Enrich minimal provider signal from repository-observable GitHub state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/provider_first_touch_repository_enrichment.py \
            --input "$RUNNER_TEMP/provider-first-touch-envelope.json" \
            --output "$RUNNER_TEMP/provider-first-touch-enriched-envelope.json"

      - name: Capture provider First Touch
        run: |
          python3 scripts/provider_first_touch_ingress.py \
            --envelope "$RUNNER_TEMP/provider-first-touch-enriched-envelope.json" \
            --capture-output "$RUNNER_TEMP/provider-first-touch-capture.json"

      - name: Restore previous GSCC GSE First Touch state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/first_touch_state_artifact.py restore             --repository "${GITHUB_REPOSITORY}"             --run-id "${GITHUB_RUN_ID}"             --scope "${{ steps.arrival.outputs.state_scope }}"             --output "${RUNNER_TEMP}/first-touch-previous.sqlite"

      - name: Materialize existing B00-B30 first-touch database
        run: |
          python3 scripts/first_touch_field_block_gate.py             --capture "$RUNNER_TEMP/provider-first-touch-capture.json"             --output "$RUNNER_TEMP/provider-first-touch-capture.sqlite"             --source-ref "provider-first-touch:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

      - name: Install persisted GSCC runtime schemas
        run: |
          python3 - <<'PY'
          import sqlite3, os
          from pathlib import Path
          db=Path(os.environ["RUNNER_TEMP"])/"provider-first-touch-capture.sqlite"
          conn=sqlite3.connect(db)
          try:
              for name in (
                  "008_gscc_observable_entry_pipeline.sql",
                  "009_gscc_post_q1_gate_route.sql",
                  "010_gscc_arrival_session_identity.sql",
                  "011_gscc_session_runtime.sql",
              ):
                  conn.executescript((Path(".governance/control-plane-db")/name).read_text(encoding="utf-8"))
              conn.commit()
          finally:
              conn.close()
          PY

      - name: Merge previous persisted GSCC state
        run: |
          if [ -f "$RUNNER_TEMP/first-touch-previous.sqlite" ]; then
            python3 scripts/first_touch_state_artifact.py merge               --current "$RUNNER_TEMP/provider-first-touch-capture.sqlite"               --previous "$RUNNER_TEMP/first-touch-previous.sqlite"
          else
            echo "NO_PRIOR_PERSISTED_GSCC_STATE"
          fi

      - name: Build expected first-touch field registry
        run: python3 scripts/first_touch_expected_field_registry.py

      - name: Build provider first-touch completeness packet
        run: |
          python3 scripts/first_touch_connection_completeness.py             --capture "$RUNNER_TEMP/provider-first-touch-capture.json"             --output "$RUNNER_TEMP/provider-first-touch-completeness.json"

      - name: Evaluate mandatory First Touch entry contract
        id: entry
        run: |
          python3 scripts/first_touch_entry_contract.py             --capture "$RUNNER_TEMP/provider-first-touch-capture.json"             --completeness "$RUNNER_TEMP/provider-first-touch-completeness.json"             --db "$RUNNER_TEMP/provider-first-touch-capture.sqlite"             --output "$RUNNER_TEMP/provider-first-touch-entry-contract.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"provider-first-touch-entry-contract.json"
          v=json.loads(p.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("status="+v["status"]+"\n")
              f.write("classification="+v["classification"]+"\n")
          PY

      - name: Run canonical persisted GSCC entry pipeline
        id: persisted_entry
        run: |
          python3 scripts/gscc_persisted_entry_pipeline.py             --provider-envelope "$RUNNER_TEMP/provider-first-touch-enriched-envelope.json"             --github "$RUNNER_TEMP/provider-first-touch-enriched-envelope.json"             --db "$RUNNER_TEMP/provider-first-touch-capture.sqlite"             --run-id "provider-first-touch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             > "$RUNNER_TEMP/gscc-persisted-entry-result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gscc-persisted-entry-result.json"
          v=json.loads(p.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("entry_status="+str(v.get("entry_status"))+"\n")
              f.write("classification="+str(v.get("classification"))+"\n")
              f.write("next_gate="+str(v.get("next_gate"))+"\n")
          PY

      - name: Prepare per-arrival GSCC session runtime
        if: ${{ github.event_name == 'issues' && steps.persisted_entry.outputs.next_gate == 'Q1' }}
        id: session_runtime
        run: |
          python3 scripts/gscc_session_runtime.py prepare             --db "$RUNNER_TEMP/provider-first-touch-capture.sqlite"             --run-id "provider-first-touch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             --issue-number "${{ github.event.issue.number }}"             > "$RUNNER_TEMP/gscc-session-runtime.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"gscc-session-runtime.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("runtime_id="+v["runtime_id"]+"\n")
              f.write("state="+v["state"]+"\n")
          d=v["dispatch"]; cmd=d["command"]; p=cmd["payload"]
          ack={"runtime_id":v["runtime_id"],"payload":{
            "event":"command_ack","session_id":d["target_session_id"],"dispatch_id":d["dispatch_id"],
            "command_id":cmd["command_id"],"correlation_id":cmd["correlation_id"],"delivery_state":"ACKNOWLEDGED"}}
          resp={"runtime_id":v["runtime_id"],"payload":{
            "event":"challenge_response","session_id":d["target_session_id"],"dispatch_id":d["dispatch_id"],
            "command_id":cmd["command_id"],"correlation_id":cmd["correlation_id"],
            "challenge_id":p["challenge_id"],"nonce":p["nonce"],"challenge_status":"ACK"}}
          body="### GSCC Q9 control challenge\n\nThis challenge belongs only to this arrival. Reply first with:\n\n`/gscc-entry-ack "+json.dumps(ack,separators=(',',':'))+"`\n\nAfter the ACK is accepted, reply with:\n\n`/gscc-entry-response "+json.dumps(resp,separators=(',',':'))+"`\n"
          (Path(os.environ["RUNNER_TEMP"])/"gscc-q9-comment.txt").write_text(body,encoding="utf-8")
          PY

      - name: Deliver Q9 challenge to this arrival issue
        if: ${{ github.event_name == 'issues' && steps.session_runtime.outputs.state == 'WAITING_Q9_ACK' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -f body="$(cat "$RUNNER_TEMP/gscc-q9-comment.txt")"

      - name: Persist canonical GSCC First Touch state
        uses: actions/upload-artifact@v4
        with:
          name: first-touch-state-${{ steps.arrival.outputs.state_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-first-touch-capture.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Build canonical GSCC First Touch handoff
        if: ${{ steps.entry.outputs.status == 'ENTRY_READY_FOR_Q1' }}
        run: |
          python3 scripts/gscc/first_touch_handoff.py             --entry "$RUNNER_TEMP/provider-first-touch-entry-contract.json"             --db "$RUNNER_TEMP/provider-first-touch-capture.sqlite"             --output "$RUNNER_TEMP/gscc-first-touch-handoff.json"

      - name: Upload provider first-touch evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-first-touch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/provider-first-touch-envelope.json
            ${{ runner.temp }}/provider-first-touch-enriched-envelope.json
            ${{ runner.temp }}/provider-first-touch-capture.json
            ${{ runner.temp }}/provider-first-touch-capture.sqlite
            ${{ runner.temp }}/provider-first-touch-completeness.json
            ${{ runner.temp }}/provider-first-touch-entry-contract.json
            ${{ runner.temp }}/gscc-persisted-entry-result.json
            ${{ runner.temp }}/gscc-first-touch-handoff.json
          if-no-files-found: warn
          retention-days: 30

  control:
    if: ${{ github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[GSCC First Touch]') && github.actor != 'github-actions[bot]' && (startsWith(github.event.comment.body, '/gscc-entry-ack ') || startsWith(github.event.comment.body, '/gscc-entry-response ')) }}
    permissions:
      contents: write
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve this arrival state scope
        id: arrival_scope
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.gscc_arrival_identity import mint
          event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          repository=((event.get("repository") or {}).get("full_name") or os.environ.get("GITHUB_REPOSITORY"))
          result=mint({"repository":repository,"identity":{}},event,run_id=os.environ.get("GITHUB_RUN_ID"),run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("state_scope="+result["gscc_arrival"]["state_scope"]+"\n")
              f.write("arrival_ref="+result["gscc_arrival"]["arrival_ref"]+"\n")
          PY

      - name: Restore this arrival runtime state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/first_touch_state_artifact.py restore             --repository "${GITHUB_REPOSITORY}"             --run-id "${GITHUB_RUN_ID}"             --scope "${{ steps.arrival_scope.outputs.state_scope }}"             --output "${RUNNER_TEMP}/provider-first-touch-capture.sqlite"
          test -f "${RUNNER_TEMP}/provider-first-touch-capture.sqlite"

      - name: Apply Q9 control event
        id: q9
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw=os.environ["COMMENT_BODY"].strip()
          prefix="/gscc-entry-ack " if raw.startswith("/gscc-entry-ack ") else "/gscc-entry-response "
          v=json.loads(raw[len(prefix):])
          if not isinstance(v,dict) or not isinstance(v.get("payload"),dict) or not v.get("runtime_id"):
              raise SystemExit("GSCC_Q9_CONTROL_PAYLOAD_INVALID")
          Path(os.environ["RUNNER_TEMP"]).joinpath("control-input.json").write_text(json.dumps(v),encoding="utf-8")
          PY
          runtime_id="$(python3 -c 'import json,os,pathlib; print(json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("control-input.json").read_text())["runtime_id"])')"
          payload="$(python3 -c 'import json,os,pathlib; print(json.dumps(json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("control-input.json").read_text())["payload"],separators=(",",":")))')"
          python3 scripts/gscc_session_runtime.py control             --db "$RUNNER_TEMP/provider-first-touch-capture.sqlite"             --runtime-id "$runtime_id"             --payload-json "$payload"             --observed-at "$COMMENT_AT"             > "$RUNNER_TEMP/gscc-session-control-result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"gscc-session-control-result.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("runtime_id="+v["runtime_id"]+"\n")
              f.write("state="+v["state"]+"\n")
          if v["state"]=="GSE_VERIFIED_WAITING_GACR":
              (Path(os.environ["RUNNER_TEMP"])/"gacr-attach.json").write_text(json.dumps(v["gacr_attach"],separators=(",",":")),encoding="utf-8")
          PY

      - name: Record accepted Q9 ACK
        if: ${{ steps.q9.outputs.state == 'WAITING_Q9_RESPONSE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments"             -f body="### GSCC Q9 ACK accepted\n\nThe arrival remains isolated under runtime ${{ steps.q9.outputs.runtime_id }}. Send the challenge-response command from the Q9 challenge message."

      - name: Request canonical GACR attach after Q10
        if: ${{ steps.q9.outputs.state == 'GSE_VERIFIED_WAITING_GACR' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gacr-attach.json"
          payload=json.loads(p.read_text(encoding="utf-8"))
          for key in ("capabilities","wake_channels"):
              if isinstance(payload.get(key),list):
                  payload[key]=",".join(str(x) for x in payload[key])
          # GitHub repository_dispatch limits client_payload to 10 top-level
          # properties. Preserve the full arrival evidence by using the
          # existing GACR arrival_context expansion contract instead of
          # dropping fields.
          arrival_context={"repository":os.environ["GITHUB_REPOSITORY"]}
          for key in ("observed_head","branch","last_evidence","entry_action","connection_intent"):
              value=payload.pop(key,None)
              if value not in (None,""):
                  arrival_context[key]=value
          payload.pop("schema",None)
          payload.pop("event",None)
          payload["source"]="GSCC_PRE_GSE_RUNTIME"
          payload["arrival_context"]=arrival_context
          if len(payload)>10:
              raise SystemExit(f"GACR_DISPATCH_CLIENT_PAYLOAD_TOO_WIDE:{len(payload)}")
          out={"event_type":"gacr_auto-attach","client_payload":payload}
          (Path(os.environ["RUNNER_TEMP"])/"gacr-auto-attach-dispatch.json").write_text(
              json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8"
          )
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches"             --input "$RUNNER_TEMP/gacr-auto-attach-dispatch.json"

      - name: Wait for canonical GACR session and bind Q2-Q12
        if: ${{ steps.q9.outputs.state == 'GSE_VERIFIED_WAITING_GACR' }}
        id: bind
        env:
          RUNTIME_ID: ${{ steps.q9.outputs.runtime_id }}
        run: |
          set -euo pipefail
          connection_ref="$(python3 -c 'import json,os,pathlib; print(json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("gacr-attach.json").read_text())["connection_ref"])')"
          found=0
          for i in $(seq 1 30); do
            git fetch origin main >/dev/null 2>&1
            if git show FETCH_HEAD:.governance/control-plane-state/gacr-sessions.json > "$RUNNER_TEMP/gacr-sessions.json" 2>/dev/null; then
              if CONNECTION_REF="$connection_ref" RUNNER_TEMP="$RUNNER_TEMP" python3 -c 'import json,os,pathlib; d=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("gacr-sessions.json").read_text()); ref=os.environ["CONNECTION_REF"]; m=[s for s in d.get("sessions",[]) if s.get("connection_ref")==ref and s.get("status")=="ACTIVE" and (s.get("relay") or {}).get("state")=="ACTIVE"]; raise SystemExit(0 if len(m)==1 else 1)'; then
                found=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$found" != "1" ]; then
            echo "GACR_BIND_TIMEOUT"; exit 4
          fi
          current_head="$(git rev-parse FETCH_HEAD)"
          python3 scripts/gscc_session_runtime.py bind-gacr             --db "$RUNNER_TEMP/provider-first-touch-capture.sqlite"             --runtime-id "$RUNTIME_ID"             --sessions "$RUNNER_TEMP/gacr-sessions.json"             --current-head "$current_head"             > "$RUNNER_TEMP/gscc-gacr-bind-result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"gscc-gacr-bind-result.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("state="+v["state"]+"\n")
              f.write("gacr_session_id="+str(v.get("gacr_session_id"))+"\n")
          PY

      - name: Report Q12 completion and F1 next gate
        if: ${{ steps.bind.outputs.state == 'READY_FOR_F1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments"             -f body="### GSCC → GSE → GACR qualification complete\n\nRuntime: ${{ steps.q9.outputs.runtime_id }}\nGACR session: ${{ steps.bind.outputs.gacr_session_id }}\nLast gate: Q12\nNext gate: F1\n\n00_START_HERE.md remains NOT_YET_APPLICABLE until F1 validates the first requested governed function."

      - name: Persist resumed per-arrival runtime state
        uses: actions/upload-artifact@v4
        with:
          name: first-touch-state-${{ steps.arrival_scope.outputs.state_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-first-touch-capture.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Upload resumed runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: gscc-session-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gscc-session-control-result.json
            ${{ runner.temp }}/gscc-gacr-bind-result.json
          if-no-files-found: warn
          retention-days: 30

  release:
    if: ${{ github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[GSCC First Touch]') && github.actor != 'github-actions[bot]' && startsWith(github.event.comment.body, '/gscc-entry-release ') }}
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve this arrival state scope
        id: arrival_scope
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.gscc_arrival_identity import mint
          event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          repository=((event.get("repository") or {}).get("full_name") or os.environ.get("GITHUB_REPOSITORY"))
          result=mint({"repository":repository,"identity":{}},event,run_id=os.environ.get("GITHUB_RUN_ID"),run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("state_scope="+result["gscc_arrival"]["state_scope"]+"\n")
          PY

      - name: Restore this arrival runtime state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/first_touch_state_artifact.py restore \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --scope "${{ steps.arrival_scope.outputs.state_scope }}" \
            --output "${RUNNER_TEMP}/provider-first-touch-capture.sqlite"
          test -f "${RUNNER_TEMP}/provider-first-touch-capture.sqlite"

      - name: Validate F1 receipt and release to normal governance
        id: release
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw=os.environ["COMMENT_BODY"].strip()
          prefix="/gscc-entry-release "
          if not raw.startswith(prefix):
              raise SystemExit("GSCC_F1_RELEASE_PREFIX_INVALID")
          payload=json.loads(raw[len(prefix):])
          if not isinstance(payload,dict) or not payload.get("runtime_id") or not isinstance(payload.get("exposure_receipt"),dict):
              raise SystemExit("GSCC_F1_RELEASE_PAYLOAD_INVALID")
          Path(os.environ["RUNNER_TEMP"]).joinpath("gscc-f1-release-input.json").write_text(
              json.dumps(payload,ensure_ascii=False,sort_keys=True),encoding="utf-8"
          )
          PY
          runtime_id="$(python3 -c 'import json,os,pathlib; print(json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("gscc-f1-release-input.json").read_text())["runtime_id"])')"
          receipt="$(python3 -c 'import json,os,pathlib; print(json.dumps(json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("gscc-f1-release-input.json").read_text())["exposure_receipt"],separators=(",",":")))')"
          current_head="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$current_head"
          python3 scripts/gscc_session_runtime.py release-f1 \
            --db "$RUNNER_TEMP/provider-first-touch-capture.sqlite" \
            --runtime-id "$runtime_id" \
            --receipt-json "$receipt" \
            --current-head "$current_head" \
            > "$RUNNER_TEMP/gscc-normal-governance-release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"gscc-normal-governance-release.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("runtime_id="+v["runtime_id"]+"\n")
              f.write("state="+v["state"]+"\n")
              f.write("gacr_session_id="+v["gacr_session_id"]+"\n")
              f.write("exposure_receipt="+v["exposure_receipt"]+"\n")
              f.write("released_head="+v["released_head"]+"\n")
          PY

      - name: Report release to normal governed workflow
        if: ${{ steps.release.outputs.state == 'RELEASED_TO_NORMAL_GOVERNANCE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="### GSCC/GSE/GACR pre-entry released\n\nRuntime: ${{ steps.release.outputs.runtime_id }}\nGACR session: ${{ steps.release.outputs.gacr_session_id }}\nF1 receipt: ${{ steps.release.outputs.exposure_receipt }}\nReleased HEAD: ${{ steps.release.outputs.released_head }}\n\nStatus: RELEASED_TO_NORMAL_GOVERNANCE\nNext authority: 00_START_HERE.md\n\nThe pre-entry lane is complete for this arrival. Normal governed workflow must now continue from 00_START_HERE.md without replaying GSCC First Touch."

      - name: Persist released per-arrival runtime state
        uses: actions/upload-artifact@v4
        with:
          name: first-touch-state-${{ steps.arrival_scope.outputs.state_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-first-touch-capture.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Upload normal-governance release evidence
        uses: actions/upload-artifact@v4
        with:
          name: gscc-normal-governance-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gscc-f1-release-input.json
            ${{ runner.temp }}/gscc-normal-governance-release.json
          if-no-files-found: error
          retention-days: 30
